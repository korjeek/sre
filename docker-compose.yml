services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sre
      POSTGRES_PASSWORD: sre
      POSTGRES_DB: incidents
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sre -d incidents"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: ["/app/migrate"]
    environment:
      DATABASE_URL: postgres://sre:sre@postgres:5432/incidents?sslmode=disable
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://sre:sre@postgres:5432/incidents?sslmode=disable
      LOG_LEVEL: info
      STATIC_DIR: /app/web
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
