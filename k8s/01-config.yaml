apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: sre
data:
  PORT: "8080"
  METRICS_PORT: "9090"
  LOG_LEVEL: "info"
  STATIC_DIR: "/app/web"
  MIGRATIONS_DIR: "/app/migrations"
  APP_ENV: "minikube"
  APP_VERSION: "1.1.0"
  CHAOS_ERROR_RATE: "0"
  CHAOS_LATENCY_MS: "0"
---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: sre
type: Opaque
stringData:
  POSTGRES_USER: "sre"
  POSTGRES_PASSWORD: "sre"
  POSTGRES_DB: "incidents"
  DATABASE_URL: "postgres://sre:sre@postgres:5432/incidents?sslmode=disable"
