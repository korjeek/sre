apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: sre
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: migrate
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432; do echo waiting for postgres; sleep 2; done"]
      containers:
        - name: migrate
          image: sre-migrate:latest
          imagePullPolicy: IfNotPresent
          command: ["/app/migrate"]
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: db-credentials
