apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: sre
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      initContainers:
        - name: wait-for-schema
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - >
              until psql "$DATABASE_URL" -tAc "SELECT 1 FROM incidents LIMIT 1" >/dev/null 2>&1;
              do echo "waiting for migrations"; sleep 2; done
          envFrom:
            - secretRef:
                name: db-credentials
      containers:
        - name: api
          image: sre-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9090
              name: metrics
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: db-credentials
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: sre
spec:
  type: NodePort
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
